<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ssfp 控制台</title>
<style>
/* 布局：顶部状态条 + 概览数字；左侧用户栏，右侧用户详情（设备、订阅、连接、流量） */
:root {
  --bg: #f4f6f8; --panel: #ffffff; --line: #dde3ea; --fg: #17202b; --mute: #5d6b7a;
  --accent: #0f6f6a; --accent-soft: #e0f1ef; --on-accent: #ffffff;
  --ok: #1f8a4c; --warn: #b7791f; --bad: #c0392b;
  --win: #2a66c9; --apple: #5a5f66; --android: #2f8f4e; --linux: #b06b12; --none: #8a94a0;
  --sans: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --mono: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0f1419; --panel: #161d24; --line: #26313c; --fg: #e3e9ef; --mute: #8b9aa9;
  --accent: #3cc4b8; --accent-soft: #123532; --on-accent: #0b1514; --ok: #49c27c; --warn: #e0a84a; --bad: #ef6b5b;
  --win: #6b9cf0; --apple: #b7bcc3; --android: #5fc785; --linux: #e3a14d; --none: #6d7884; color-scheme: dark } }
* { box-sizing: border-box }
html, body { margin: 0 }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.5 }
.wrap { max-width: 1240px; margin: 0 auto; padding: 20px max(16px, env(safe-area-inset-right)) 48px max(16px, env(safe-area-inset-left)); display: grid; gap: 16px }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums }
.mute { color: var(--mute) }
.small { font-size: 12px }
h1 { font-size: 18px; margin: 0; font-weight: 600 }
h2 { font-size: 15px; margin: 0; font-weight: 600 }
h3 { font-size: 12px; margin: 0; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--mute) }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px }
.bar .brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; flex-wrap: wrap }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok) }
.dot.bad { background: var(--bad) }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; min-width: 0 }
.stat b { font-size: 20px; font-weight: 600 }
.stat svg { width: 100%; height: 30px; display: block }
@media (max-width: 760px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
.main { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 16px; align-items: start }
@media (max-width: 860px) { .main { grid-template-columns: minmax(0, 1fr) } }
.side { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 4px }
.side .head { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px 8px }
.user { all: unset; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 8px 10px; border-radius: 8px }
.user:hover { background: var(--bg) }
.user:focus-visible { outline: 2px solid var(--accent) }
.user[aria-current="true"] { background: var(--accent-soft) }
.user small { grid-column: 1 / -1; color: var(--mute); font-size: 12px }
.user.off span:first-child { text-decoration: line-through; color: var(--mute) }
button, select, input { font: inherit; color: var(--fg) }
.btn { font-size: 13px; padding: 5px 11px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; white-space: nowrap }
.btn:hover { border-color: var(--accent) }
.btn:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent) }
.btn.danger { color: var(--bad) }
.btn.arm { background: var(--bad); border-color: var(--bad); color: var(--on-accent) }
.btn.sm { font-size: 12px; padding: 2px 8px }
select, input[type=text], input[type=password] { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 4px 8px; min-width: 0 }
select.sm { font-size: 12px; padding: 1px 4px }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 14px; min-width: 0 }
.card-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between }
.detail { display: grid; gap: 16px; min-width: 0 }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.tbl { overflow-x: auto }
table { width: 100%; border-collapse: collapse; min-width: 820px }
th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: middle }
th { font-size: 12px; font-weight: 500; color: var(--mute) }
tr:last-child td { border-bottom: 0 }
tr.off td { opacity: .55 }
td .sub { font-size: 12px; color: var(--mute) }
.os { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; white-space: nowrap }
.os i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; background: var(--none) }
.os.windows i { background: var(--win) } .os.apple i { background: var(--apple) } .os.android i { background: var(--android) } .os.linux i { background: var(--linux) }
.live { color: var(--ok) }
.acts { display: flex; gap: 6px; flex-wrap: wrap }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px }
@media (max-width: 1000px) { .two { grid-template-columns: minmax(0, 1fr) } }
.field { display: flex; gap: 8px; align-items: center; min-width: 0 }
.field code { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 5px 9px; font-family: var(--mono); font-size: 12px }
pre { margin: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-family: var(--mono); font-size: 12px; line-height: 1.55; overflow: auto; max-height: 340px }
.conns { display: grid; max-height: 320px; overflow: auto }
.conns div { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px }
.conns div:last-child { border-bottom: 0 }
.conns .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.chart svg { width: 100%; height: 170px; display: block }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--mute) }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; background: var(--c) }
.empty { color: var(--mute); padding: 12px 0 }
.toast { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: calc(16px + env(safe-area-inset-bottom)); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; max-width: calc(100vw - 32px) }
.login { max-width: 460px; margin: 12vh auto 0; display: grid; gap: 12px }
.hint { font-size: 12px; color: var(--mute) }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden></div>
<script>
"use strict";
const OSN = { auto: "自动", windows: "Windows", apple: "macOS / iOS", android: "Android", linux: "Linux", none: "不改动" };
const TPLS = ["auto", "windows", "apple", "android", "linux", "none"];
const COLORS = ["var(--win)", "var(--apple)", "var(--android)", "var(--linux)", "var(--accent)", "var(--warn)", "var(--bad)", "var(--none)"];
let token = "";
try { token = localStorage.getItem("ssfp_token") || ""; } catch (e) {}
const hm = location.hash.match(/t=([0-9a-f]+)/);
if (hm) { token = hm[1]; try { localStorage.setItem("ssfp_token", token); } catch (e) {} history.replaceState(null, "", location.pathname); }
let S = { ov: null, users: [], conns: [], hist: null, cur: null, dialer: "" };
try { S.dialer = localStorage.getItem("ssfp_dialer") || ""; } catch (e) {}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function human(b) { b = +b || 0; if (b >= 1e9) return (b / 1e9).toFixed(1) + " GB"; if (b >= 1e6) return (b / 1e6).toFixed(1) + " MB"; if (b >= 1e3) return (b / 1e3).toFixed(0) + " KB"; return b + " B"; }
function rate(bps) { const m = bps * 8 / 1e6; return m >= 100 ? m.toFixed(0) + " Mbit/s" : m >= 1 ? m.toFixed(1) + " Mbit/s" : (bps * 8 / 1e3).toFixed(0) + " kbit/s"; }
function ago(ms) { if (!ms) return "从未"; const s = (Date.now() - ms) / 1000; if (s < 60) return "刚刚"; if (s < 3600) return Math.floor(s / 60) + " 分钟前"; if (s < 86400) return Math.floor(s / 3600) + " 小时前"; return Math.floor(s / 86400) + " 天前"; }
function dur(s) { const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60); return d ? `${d} 天 ${h} 小时` : h ? `${h} 小时 ${m} 分` : `${m} 分钟`; }
let tt; function say(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2200); }

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { token = ""; try { localStorage.removeItem("ssfp_token"); } catch (e) {} renderLogin("令牌无效或已更换"); throw new Error("401"); }
  const ct = r.headers.get("content-type") || "";
  const data = ct.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error(data.error || data);
  return data;
}
async function act(method, path, body, ok) {
  try { await api(method, path, body); if (ok) say(ok); await refresh(); } catch (e) { if (e.message !== "401") say(e.message); }
}
function copy(text, what) {
  const done = () => say("已复制" + (what ? " " + what : ""));
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch (e) { say("复制失败，请手动选择"); } ta.remove();
}

function renderLogin(msg) {
  $("#app").innerHTML = `<div class="card login"><h1>ssfp 控制台</h1>
    <p class="mute">在服务器上运行 <code class="mono">ssfp ctl url</code>，用输出的地址打开；或把令牌粘贴到这里。</p>
    ${msg ? `<p style="color:var(--bad)">${esc(msg)}</p>` : ""}
    <form id="lf" class="row"><input id="tok" type="password" placeholder="管理令牌" style="flex:1" autocomplete="off"><button class="btn primary">进入</button></form></div>`;
  $("#lf").addEventListener("submit", e => { e.preventDefault(); token = $("#tok").value.trim(); try { localStorage.setItem("ssfp_token", token); } catch (x) {} start(); });
}

function spark(rates) {
  if (!rates || rates.length < 2) return "";
  const v = rates.map(r => r[1] + r[2]); const max = Math.max(...v, 1);
  const pts = v.map((x, i) => [i * 120 / (v.length - 1), 28 - x / max * 24]);
  const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const last = pts[pts.length - 1];
  return `<svg viewBox="0 0 120 30" preserveAspectRatio="none" aria-hidden="true"><path d="${d} L120 30 L0 30Z" fill="var(--accent-soft)"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.5" vector-effect="non-scaling-stroke"/><circle cx="${last[0]}" cy="${last[1]}" r="2" fill="var(--accent)"/></svg>`;
}

function shell() {
  $("#app").innerHTML = `
  <header class="bar"><div class="brand"><h1>ssfp 控制台</h1><span class="mute mono" id="addr"></span></div><span id="chips" class="row"></span></header>
  <section class="stats" id="stats"></section>
  <div class="main">
    <nav class="side" aria-label="用户"><div class="head"><h3>用户</h3><button class="btn sm" id="nu">＋ 新用户</button></div>
      <form id="nuf" class="row" hidden style="padding:0 6px 8px"><input id="nun" type="text" placeholder="用户名" style="flex:1" maxlength="32"><button class="btn sm primary">添加</button></form>
      <div id="ulist" style="display:grid;gap:4px"></div></nav>
    <div class="detail" id="detail"></div>
  </div>`;
  $("#nu").onclick = () => { $("#nuf").hidden = !$("#nuf").hidden; if (!$("#nuf").hidden) $("#nun").focus(); };
  $("#nuf").onsubmit = async e => { e.preventDefault(); const n = $("#nun").value.trim(); if (!n) return;
    try { const r = await api("POST", "/api/users", { name: n }); S.cur = r.id; $("#nun").value = ""; $("#nuf").hidden = true; say("已添加用户 " + n); await refresh(); } catch (x) { say(x.message); } };
}

function renderTop() {
  const o = S.ov; if (!o) return;
  $("#addr").textContent = `${o.public_host}:${o.listen.split(":").pop()}`;
  $("#chips").innerHTML = `<span class="chip"><span class="dot"></span>运行 ${dur(o.uptime_s)}</span>
    <span class="chip">${o.ebpf_iface ? "eBPF 已挂载 " + esc(o.ebpf_iface) : '<span class="dot bad"></span>eBPF 未启用'}</span>
    <span class="chip">${o.udp ? (o.block_quic ? "UDP · 丢弃 443" : "UDP") : "仅 TCP"}</span>
    <span class="chip mono">v${esc(o.version)}</span>`;
  const r = o.rate.length ? o.rate[o.rate.length - 1] : [0, 0, 0];
  $("#stats").innerHTML = `
    <div class="stat"><h3>当前连接</h3><b class="mono">${o.conns}</b><span class="mute">${o.online_devices} 台设备在线</span></div>
    <div class="stat"><h3>今日流量</h3><b class="mono">${human(o.today.up + o.today.down)}</b><span class="mute mono">↑ ${human(o.today.up)} · ↓ ${human(o.today.down)}</span></div>
    <div class="stat"><h3>当前速率</h3><b class="mono">${rate(r[1] + r[2])}</b>${spark(o.rate)}</div>
    <div class="stat"><h3>本月</h3><b class="mono">${human(o.month.up + o.month.down)}</b><span class="mute">${o.users} 个用户 · ${o.devices} 台设备</span></div>`;
}

function renderUsers() {
  if (S.cur == null || !S.users.some(u => u.id === S.cur)) S.cur = S.users.length ? S.users[0].id : null;
  $("#ulist").innerHTML = S.users.map(u => {
    const m = u.devices.reduce((a, d) => a + d.month.up + d.month.down, 0);
    const on = u.devices.filter(d => d.conns > 0).length;
    return `<button class="user${u.enabled ? "" : " off"}" aria-current="${u.id === S.cur}" data-u="${u.id}"><span>${esc(u.name)}</span><span class="mono mute">${human(m)}</span><small>${u.devices.length} 台设备 · ${on} 在线${u.enabled ? "" : " · 已停用"}</small></button>`;
  }).join("") || `<div class="empty small">还没有用户</div>`;
  document.querySelectorAll(".user").forEach(b => b.onclick = () => { S.cur = +b.dataset.u; renderUsers(); renderDetail(); loadHist(); loadYaml(); });
}

function osTag(t) { return `<span class="os ${t}"><i></i>${OSN[t] || t}</span>`; }
function tplCell(d) {
  const opts = TPLS.map(t => `<option value="${t}"${t === d.template ? " selected" : ""}>${OSN[t]}</option>`).join("");
  let note = "";
  if (d.template === "auto") note = d.effective ? `学到 ${osTag(d.effective)}<div class="sub">依据 ${esc(d.learned.hint || "")}</div>` : `<div class="sub">还没学到，按客户端特征判断</div>`;
  return `<div class="row"><select class="sm" data-tpl="${d.id}" aria-label="模板">${opts}</select>${d.template === "auto" ? "" : osTag(d.template)}</div>${note}`;
}

function arm(btn, label, fn) {
  if (btn.classList.contains("arm")) { fn(); return; }
  const old = btn.textContent; btn.classList.add("arm"); btn.textContent = label;
  setTimeout(() => { btn.classList.remove("arm"); btn.textContent = old; }, 3000);
}

function renderDetail() {
  const u = S.users.find(x => x.id === S.cur);
  if (!u) { $("#detail").innerHTML = `<section class="card"><h2>开始</h2><p class="mute">先添加一个用户，再给他的每台设备各加一个节点。每台设备一把密钥，出口指纹按设备的系统模板走。</p></section>`; return; }
  const m = u.devices.reduce((a, d) => a + d.month.up + d.month.down, 0);
  const rows = u.devices.map(d => `<tr class="${d.enabled ? "" : "off"}">
      <td><b>${esc(d.name)}</b><div class="sub mono">#${d.id} · ${esc(d.node)}</div></td>
      <td>${tplCell(d)}</td>
      <td>${!d.enabled ? '<span style="color:var(--bad)">已停用</span>' : d.conns > 0 ? `<span class="live">在线 · ${d.conns} 连接</span>` : `<span class="mute">${ago(d.last_seen_ms)}</span>`}</td>
      <td class="mono">${human(d.today.up + d.today.down)} / ${human(d.month.up + d.month.down)}</td>
      <td><div class="acts">
        <button class="btn sm" data-copy-link="${d.id}">复制链接</button>
        <button class="btn sm" data-ren="${d.id}">改名</button>
        <button class="btn sm" data-en="${d.id}" data-v="${!d.enabled}">${d.enabled ? "停用" : "启用"}</button>
        <button class="btn sm" data-rot="${d.id}">换密钥</button>
        <button class="btn sm danger" data-del="${d.id}">删除</button></div></td></tr>`).join("");
  $("#detail").innerHTML = `
    <section class="card">
      <div class="card-head"><div><h2>${esc(u.name)}</h2><span class="mute small">本月 ${human(m)} · ${u.devices.length} 台设备${u.enabled ? "" : " · 已停用"}</span></div>
        <div class="acts"><button class="btn sm" id="uren">改名</button><button class="btn sm" id="uen">${u.enabled ? "停用用户" : "启用用户"}</button><button class="btn sm danger" id="udel">删除用户</button></div></div>
      ${u.devices.length ? `<div class="tbl"><table><thead><tr><th>设备</th><th>系统模板</th><th>状态</th><th>今日 / 本月</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>` : `<div class="empty">这个用户还没有设备。</div>`}
      <form class="row" id="ndf"><input id="ndn" type="text" placeholder="设备名，如 Windows 台式机" maxlength="32" style="flex:1;min-width:160px">
        <select id="ndt" aria-label="模板">${TPLS.map(t => `<option value="${t}">${OSN[t]}</option>`).join("")}</select>
        <button class="btn primary">＋ 添加设备</button></form>
      <div class="hint">模板选“自动”时，按设备访问的系统服务（如 Windows 联网检测、Apple 推送、Android 连通性检测）学习系统；能确定的话直接选系统更可靠。</div>
    </section>
    <section class="card">
      <div class="card-head"><h2>订阅</h2><span class="mute small">Clash 格式：每台设备一个节点 + 一个包含全部节点的分组</span></div>
      <div class="field"><code id="suburl">${esc(u.sub_url || "看板未开启")}${S.dialer ? "?dialer=" + encodeURIComponent(S.dialer) : ""}</code><button class="btn sm" id="csub">复制地址</button><button class="btn sm" id="rtok">重置地址</button></div>
      <div class="row"><label class="small mute" for="dial">中转节点（dialer-proxy）</label><input id="dial" type="text" value="${esc(S.dialer)}" placeholder="你的三方节点名，可留空" style="flex:1;min-width:160px"></div>
      <pre id="yaml">加载中…</pre>
      <div class="row"><button class="btn sm" id="cyaml">复制配置</button><span class="hint">订阅地址只在 VPN 内网可访问。第一次在服务器上运行 <span class="mono">ssfp ctl sub ${esc(u.name)}</span> 或从这里复制；每台设备选自己名字的节点。</span></div>
    </section>
    <div class="two">
      <section class="card chart"><div class="card-head"><h2>近 7 天流量</h2><span class="mute small">每天，按设备</span></div><div id="chart" class="empty">加载中…</div></section>
      <section class="card"><div class="card-head"><h2>当前连接</h2><span class="mute small" id="ccount"></span></div><div class="conns" id="clist"></div></section>
    </div>`;
  bindDetail(u); renderConns(); renderChart(); loadYaml(true);
}

function bindDetail(u) {
  const D = id => u.devices.find(d => d.id === +id);
  $("#ndf").onsubmit = e => { e.preventDefault(); const n = $("#ndn").value.trim(); if (!n) return say("先填设备名");
    act("POST", `/api/users/${u.id}/devices`, { name: n, template: $("#ndt").value }, "已添加设备 " + n); };
  document.querySelectorAll("[data-tpl]").forEach(s => s.onchange = () => act("PATCH", `/api/devices/${s.dataset.tpl}`, { template: s.value }, "已改为 " + OSN[s.value] + "，现有连接已断开重连"));
  document.querySelectorAll("[data-copy-link]").forEach(b => b.onclick = () => copy(D(b.dataset.copyLink).link, "ss:// 链接"));
  document.querySelectorAll("[data-en]").forEach(b => b.onclick = () => act("PATCH", `/api/devices/${b.dataset.en}`, { enabled: b.dataset.v === "true" }, b.dataset.v === "true" ? "已启用" : "已停用，现有连接已断开"));
  document.querySelectorAll("[data-rot]").forEach(b => b.onclick = () => arm(b, "确认换密钥？", () => act("POST", `/api/devices/${b.dataset.rot}/rotate-key`, null, "已换密钥：这台设备需要重新导入链接")));
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => arm(b, "确认删除？", () => act("DELETE", `/api/devices/${b.dataset.del}`, null, "已删除设备")));
  document.querySelectorAll("[data-ren]").forEach(b => b.onclick = () => inlineRename(b, D(b.dataset.ren).name, n => act("PATCH", `/api/devices/${b.dataset.ren}`, { name: n }, "已改名")));
  $("#uren").onclick = () => inlineRename($("#uren"), u.name, n => act("PATCH", `/api/users/${u.id}`, { name: n }, "已改名"));
  $("#uen").onclick = () => act("PATCH", `/api/users/${u.id}`, { enabled: !u.enabled }, u.enabled ? "已停用用户" : "已启用用户");
  $("#udel").onclick = () => arm($("#udel"), "确认删除用户和全部设备？", () => act("DELETE", `/api/users/${u.id}`, null, "已删除用户"));
  $("#csub").onclick = () => copy($("#suburl").textContent, "订阅地址");
  $("#rtok").onclick = () => arm($("#rtok"), "确认重置？旧地址失效", () => act("POST", `/api/users/${u.id}/rotate-token`, null, "订阅地址已重置"));
  $("#cyaml").onclick = () => copy($("#yaml").textContent, "配置");
  let dt; $("#dial").oninput = e => { S.dialer = e.target.value.trim(); try { localStorage.setItem("ssfp_dialer", S.dialer); } catch (x) {}
    $("#suburl").textContent = (u.sub_url || "") + (S.dialer ? "?dialer=" + encodeURIComponent(S.dialer) : ""); clearTimeout(dt); dt = setTimeout(() => loadYaml(true), 300); };
}

function inlineRename(btn, cur, done) {
  const f = document.createElement("form"); f.className = "row";
  f.innerHTML = `<input type="text" maxlength="32" value="${esc(cur)}" style="width:150px"><button class="btn sm primary">保存</button>`;
  btn.replaceWith(f); const i = f.querySelector("input"); i.focus(); i.select();
  f.onsubmit = e => { e.preventDefault(); const n = i.value.trim(); if (n && n !== cur) done(n); else refresh(); };
}

let yamlFor = null;
async function loadYaml(force) {
  if (S.cur == null || !$("#yaml")) return;
  const k = S.cur + "|" + S.dialer + "|" + JSON.stringify(S.users.find(u => u.id === S.cur)?.devices.map(d => [d.name, d.enabled, d.link]));
  if (!force && k === yamlFor) return; yamlFor = k;
  try { $("#yaml").textContent = await api("GET", `/api/users/${S.cur}/clash${S.dialer ? "?dialer=" + encodeURIComponent(S.dialer) : ""}`); } catch (e) {}
}

function renderConns() {
  const u = S.users.find(x => x.id === S.cur); if (!u || !$("#clist")) return;
  const ids = new Set(u.devices.map(d => d.id));
  const cs = S.conns.filter(c => ids.has(c.device_id));
  $("#ccount").textContent = cs.length + " 条";
  $("#clist").innerHTML = cs.slice(0, 100).map(c => `<div><span class="t"><b>${esc(c.device.split("/").pop())}</b> <span class="mute">${esc(c.target)}</span><br><span class="small mute">${c.udp ? "UDP" : "TCP"} · 模板 ${esc(OSN[c.template] || c.template || "-")} · ${ago(c.started_ms)}</span></span>
    <span class="mono small">↑${human(c.up)} ↓${human(c.down)}</span><button class="btn sm" data-close="${c.id}" ${c.udp ? "disabled" : ""}>断开</button></div>`).join("") || `<div class="empty">没有连接</div>`;
  document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => act("POST", `/api/conns/${b.dataset.close}/close`, null, "已断开"));
}

async function loadHist() {
  if (S.cur == null) return;
  try { S.hist = await api("GET", `/api/history?days=7&user=${S.cur}`); renderChart(); } catch (e) {}
}
function renderChart() {
  const h = S.hist, el = $("#chart"); if (!el || !h) return;
  const series = h.series.filter(s => s.values.some(v => v > 0));
  if (!series.length) { el.className = "empty"; el.textContent = "近 7 天还没有流量"; return; }
  el.className = "";
  const tot = h.dates.map((_, i) => series.reduce((a, s) => a + s.values[i], 0));
  const max = Math.max(...tot, 1);
  const unit = max >= 1e9 ? [1e9, "GB"] : max >= 1e6 ? [1e6, "MB"] : [1e3, "KB"];
  const top = Math.ceil(max / unit[0] * 1.1 * 10) / 10 || 1;
  const H = 120, X0 = 44, W = 370, bw = Math.min(34, W / h.dates.length * .6);
  let g = "", lab = "";
  h.dates.forEach((d, i) => { const x = X0 + (i + .5) * W / h.dates.length - bw / 2; let y = 20 + H;
    series.forEach((s, j) => { const hh = s.values[i] / unit[0] / top * H; if (hh > 0) { y -= hh; g += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}" fill="${COLORS[j % COLORS.length]}"><title>${esc(s.name)} ${d}：${human(s.values[i])}</title></rect>`; } });
    lab += `<text x="${(x + bw / 2).toFixed(1)}" y="${20 + H + 16}">${i === h.dates.length - 1 ? "今天" : d.slice(5)}</text>`; });
  el.innerHTML = `<svg viewBox="0 0 420 170" role="img" aria-label="近 7 天按设备的流量">
    <g stroke="var(--line)"><line x1="${X0}" y1="20" x2="414" y2="20"/><line x1="${X0}" y1="${20 + H / 2}" x2="414" y2="${20 + H / 2}"/><line x1="${X0}" y1="${20 + H}" x2="414" y2="${20 + H}"/></g>
    <g fill="var(--mute)" font-size="10" font-family="var(--mono)" text-anchor="end"><text x="${X0 - 6}" y="24">${top} ${unit[1]}</text><text x="${X0 - 6}" y="${24 + H / 2}">${(top / 2).toFixed(1)}</text><text x="${X0 - 6}" y="${24 + H}">0</text></g>
    ${g}<g fill="var(--mute)" font-size="10" text-anchor="middle">${lab}</g></svg>
    <div class="legend">${series.map((s, j) => `<span style="--c:${COLORS[j % COLORS.length]}">${esc(s.name)}</span>`).join("")}</div>`;
}

let busy = false;
async function refresh() {
  if (busy) return; busy = true;
  try {
    const [ov, users, conns] = await Promise.all([api("GET", "/api/overview"), api("GET", "/api/users"), api("GET", "/api/conns")]);
    const focused = document.activeElement && document.activeElement.closest && document.activeElement.closest("#detail form, #dial, select");
    S.ov = ov; S.conns = conns; const changed = JSON.stringify(users) !== JSON.stringify(S.users); S.users = users;
    renderTop(); if (changed) renderUsers();
    if (!$("#yaml") || (changed && !focused)) renderDetail(); else renderConns();
    loadYaml(false);
  } catch (e) { if (e.message !== "401") $("#addr").textContent = "连接失败：" + e.message; }
  finally { busy = false; }
}
let timers = [];
async function start() {
  if (!token) return renderLogin();
  shell();
  try { await refresh(); } catch (e) { return; }
  if (!$("#ulist")) return;
  renderUsers(); renderDetail(); loadHist();
  timers.forEach(clearInterval);
  timers = [setInterval(refresh, 5000), setInterval(loadHist, 60000)];
}
start();
</script>
</body>
</html>
