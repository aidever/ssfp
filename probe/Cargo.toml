[package]
name = "fpprobe"
version = "0.1.0"
edition = "2024"
description = "检测靶机：记录访客的 TCP/IP、TLS、HTTP 指纹与时序，判断是否一致"
license = "MIT"
repository = "https://github.com/aidever/ssfp"

[dependencies]
huginn-net-tcp = { version = "2.2.1", features = ["syn", "mtu"] }
huginn-net-db = { version = "2.2.1", features = ["tcp"] }
huginn-net-tls = "2.2.1"
pnet_packet = "0.35"
libc = "0.2"
tokio = { version = "1", features = ["rt", "net", "time", "macros", "sync", "io-util", "fs", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
http-body-util = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
