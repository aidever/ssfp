<title>fpprobe 检测报告</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 布局：单列诊断报告。结论条 → 三层 OS 对照 → SYN 字段与参考模板逐项比对 → 时序 → 历史 */
:root {
  --bg: #f5f6f8;
  --panel: #ffffff;
  --fg: #16202c;
  --muted: #5d6b7c;
  --line: #dde2e9;
  --accent: #1f5fbf;
  --accent-soft: #e6eefb;
  --good: #16794a;
  --good-soft: #e3f3ea;
  --warn: #9a5b00;
  --warn-soft: #fbf0dc;
  --bad: #b42318;
  --bad-soft: #fbe7e5;
  --unk: #6b7686;
  --unk-soft: #eceff3;
  --sans: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, "Noto Sans Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141b; --panel: #161d27; --fg: #e3e8ef; --muted: #93a0b1; --line: #263140;
    --accent: #6ea2ff; --accent-soft: #1a2a45;
    --good: #4cc489; --good-soft: #14301f; --warn: #e3a84a; --warn-soft: #34270f;
    --bad: #ff7b6e; --bad-soft: #3a1915; --unk: #9aa5b4; --unk-soft: #222b37;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141b; --panel: #161d27; --fg: #e3e8ef; --muted: #93a0b1; --line: #263140;
  --accent: #6ea2ff; --accent-soft: #1a2a45;
  --good: #4cc489; --good-soft: #14301f; --warn: #e3a84a; --warn-soft: #34270f;
  --bad: #ff7b6e; --bad-soft: #3a1915; --unk: #9aa5b4; --unk-soft: #222b37;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 20px; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }
h1 { font-size: 20px; margin: 0; letter-spacing: 0.01em; text-wrap: balance; }
h2 { font-size: 13px; margin: 0 0 10px; color: var(--muted); font-weight: 600; letter-spacing: 0.04em; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }

header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--muted); font-size: 12.5px; }
.meta b { color: var(--fg); font-weight: 500; }

.banner { border: 1px dashed var(--warn); background: var(--warn-soft); color: var(--fg); border-radius: 8px; padding: 8px 12px; font-size: 13px; }

/* 结论条 */
.verdicts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.v { border-radius: 10px; padding: 12px 14px; border: 1px solid var(--line); background: var(--panel); display: grid; gap: 4px; align-content: start; }
.v .k { font-size: 12.5px; color: var(--muted); }
.v .s { font-size: 17px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
.v .n { font-size: 13px; color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; flex: none; }
.st-good { color: var(--good); } .st-warn { color: var(--warn); } .st-bad { color: var(--bad); } .st-unk { color: var(--unk); }
.v.st-bad { background: var(--bad-soft); border-color: transparent; }
.v.st-warn { background: var(--warn-soft); border-color: transparent; }
.v.st-good { background: var(--good-soft); border-color: transparent; }
.v.st-unk { background: var(--unk-soft); border-color: transparent; }
.v .n, .v .k { color: var(--fg); opacity: 0.78; }

/* 三层对照 */
.layers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.layer { display: grid; gap: 8px; align-content: start; }
.layer .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.layer .title { font-weight: 600; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--unk-soft); color: var(--unk); white-space: nowrap; }
.chip.fam-windows { background: var(--accent-soft); color: var(--accent); }
.chip.fam-apple { background: var(--accent-soft); color: var(--accent); }
.chip.fam-linux { background: var(--accent-soft); color: var(--accent); }
.big { font-size: 18px; font-weight: 650; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 12px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.arrow-note { font-size: 12.5px; color: var(--muted); }

/* SYN 比对表 */
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 12px; white-space: nowrap; }
tr.diff td.obs { color: var(--bad); font-weight: 600; }
td.mark { width: 28px; text-align: center; }
.ok-mark { color: var(--good); } .diff-mark { color: var(--bad); }
.opts { display: flex; flex-wrap: wrap; gap: 4px; }
.opt { font-family: var(--mono); font-size: 11.5px; padding: 1px 6px; border-radius: 4px; background: var(--unk-soft); }
.opt.miss { background: var(--bad-soft); color: var(--bad); }
.foot { font-size: 12.5px; color: var(--muted); margin-top: 8px; }

/* 时序 */
.timing { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 12px; }
svg text { font-family: var(--sans); }
.svgbox { overflow-x: auto; }

details { font-size: 13px; }
details summary { cursor: pointer; color: var(--accent); }
details pre { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--bg); padding: 10px; border-radius: 8px; max-height: 360px; overflow: auto; }
button { font: inherit; font-size: 13px; color: var(--accent); background: var(--accent-soft); border: 0; border-radius: 6px; padding: 5px 12px; cursor: pointer; }
button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }

@media (max-width: 720px) {
  .verdicts, .layers, .timing { grid-template-columns: minmax(0, 1fr); }
}
</style>

<div class="wrap">
  <header>
    <h1>出口指纹检测</h1>
    <div class="meta" id="meta">正在读取本次连接…</div>
  </header>
  <div class="banner" id="banner" hidden></div>

  <section class="verdicts" id="verdicts" aria-label="结论"></section>

  <section class="panel">
    <h2>三层 OS 对照</h2>
    <div class="layers" id="layers"></div>
  </section>

  <section class="panel">
    <div class="row"><h2 id="syn-title">SYN 字段</h2><span class="chip" id="tpl-chip"></span></div>
    <div class="tablewrap"><table id="syn"></table></div>
    <div class="foot" id="syn-foot"></div>
  </section>

  <section class="timing">
    <div class="panel">
      <h2>握手时序（相对 SYN 到达，ms）</h2>
      <div class="svgbox" id="hs"></div>
    </div>
    <div class="panel">
      <h2>RTT 对比（ms）</h2>
      <div class="svgbox" id="rtt"></div>
      <div class="foot" id="rtt-foot"></div>
    </div>
  </section>

  <section class="panel">
    <h2>本 IP 最近的检测</h2>
    <div class="tablewrap"><table id="hist"></table></div>
  </section>

  <section class="panel">
    <div class="row">
      <h2 style="margin:0">原始数据</h2>
      <button type="button" id="copy">复制 JSON</button>
    </div>
    <details><summary>展开完整报告</summary><pre class="mono" id="raw"></pre></details>
  </section>
</div>

<script>
(() => {
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (v, d = 1) => (v == null || !isFinite(v) ? "—" : Number(v).toFixed(d));

// 按浏览器自报 OS 的参考 SYN 模板（来自设计文档，待用真实设备校准）
const TEMPLATES = {
  windows: { name: "Windows 10/11", ttl: 128, window: 64240, wscale: 8, ts: false, df: true, opts: ["MSS", "NOP", "WS", "NOP", "NOP", "SACK_PERM"] },
  apple: { name: "macOS / iOS", ttl: 64, window: 65535, wscale: 6, ts: true, df: true, opts: ["MSS", "NOP", "WS", "NOP", "NOP", "TS", "SACK_PERM", "EOL"] },
  linux: { name: "Linux / Android", ttl: 64, window: 64240, wscale: 7, ts: true, df: true, opts: ["MSS", "SACK_PERM", "TS", "NOP", "WS"] },
};
const FAM_LABEL = { windows: "Windows", apple: "Apple", linux: "Linux", unknown: "未知" };
const ST = {
  match: ["st-good", "一致"], mismatch: ["st-bad", "不一致"], ok: ["st-good", "正常"],
  suspicious: ["st-warn", "可疑"], unknown: ["st-unk", "无法判断"], pending: ["st-unk", "测量中…"],
};

// 预览用示例：TCP 部分取自 2026-11-13 从一台 Linux 服务器的实测，应用层 RTT 与历史为示例值
const SAMPLE = {
  id: "1a1d5129b5e0001", at: "2026-11-13T13:23:03Z", peer: "198.51.100.17:49444", transport: "https",
  tcp: {
    syn_at: 0, synack_at: 96759, ack_at: 67750155, first_data_at: 81288298, first_data_len: 517, syn_retrans_at: [],
    syn: { ip_version: 4, ttl: 45, initial_ttl: 64, hops: 19, df: true, ip_id: 11426, tos: 40, ip_ecn: 0, ece: false, cwr: false,
      window: 64240, data_offset: 40, options: ["MSS=1460", "SACK_PERM", "TS", "NOP", "WS=7"], mss: 1460, wscale: 7, sack_perm: true, timestamps: true },
    p0f: { os: "Linux", os_kind: "unix", quality: "specific", score: 1, dist: 19, signature: "4:45+19:0:1460:mss*44,7:mss,sok,ts,nop,ws:df,id+:0", mtu: 1500, link: "Ethernet or modem" },
    ack: { window: 502, timestamps: true },
  },
  tls: { ja4: "t13d1516h2_8daaf6152771_d8a2da3f94cd", version: "V1_3", sni: "fp.example.com", alpn_offered: "h2", alpn_negotiated: "h2", cipher_count: 15, extension_count: 16, client_hello_len: 1786 },
  http: { version: "HTTP/2.0", user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/142.0.0.0 Safari/537.36", sec_ch_ua_platform: "\"Windows\"", sec_ch_ua_mobile: "?0", accept_language: "zh-CN,zh;q=0.9" },
  os_tcp: { family: "linux", label: "Linux", source: "p0f specific" },
  os_http: { family: "windows", label: "Windows", source: "Sec-CH-UA-Platform" },
  timing: { handshake_rtt_ms: 67.65, kernel_rtt_ms: 67.72, ack_to_first_data_ms: 13.54, syn_retrans_ms: [], app_rtt_ms: 231.4, ack_to_accept_ms: 0.17 },
  verdict: { os_consistency: "mismatch", os_note: "TCP 层像 Linux，浏览器自报 Windows", rtt: "suspicious", rtt_note: "应用层 RTT 比 TCP 握手 RTT 多 164 ms，像经过了代理或隧道", first_data_gap: "ok", gap_note: "握手完成后 13.5 ms 收到首包" },
  client: { rtt_samples_ms: [244.1, 233.8, 231.4, 236.0, 238.7, 232.2, 240.3, 235.1, 231.9, 233.0], timezone: "Asia/Shanghai", languages: ["zh-CN", "zh"] },
};
const SAMPLE_HISTORY = [
  SAMPLE,
  { at: "2026-11-13T13:20:41Z", os_tcp: { label: "Linux" }, os_http: { label: "iOS" }, verdict: { os_consistency: "mismatch", rtt: "suspicious" }, timing: { handshake_rtt_ms: 66.9, app_rtt_ms: 248.0 } },
  { at: "2026-11-13T13:18:02Z", os_tcp: { label: "Linux" }, os_http: { label: "Linux" }, verdict: { os_consistency: "match", rtt: "ok" }, timing: { handshake_rtt_ms: 67.2, app_rtt_ms: 68.1 } },
];

function status(key) { return ST[key] || ST.unknown; }

function renderMeta(r, live) {
  const t = r.at ? new Date(r.at) : null;
  $("meta").innerHTML = [
    ["来源", esc(r.peer)],
    ["协议", esc(`${r.transport?.toUpperCase() ?? ""} · ${r.http?.version ?? ""}`)],
    ["时间", t ? esc(t.toLocaleString()) : "—"],
    ["编号", `<span class="mono">${esc(r.id)}</span>`],
  ].map(([k, v]) => `<span>${k} <b>${v}</b></span>`).join("");
  $("banner").hidden = live;
  if (!live) $("banner").textContent = "预览：这里连不上靶机，显示的是示例数据。TCP 部分取自 测试服务器 的实测，应用层 RTT 和历史记录是示例值。";
}

function renderVerdicts(r, rttPending) {
  const v = r.verdict || {};
  const items = [
    ["OS 一致性", v.os_consistency, v.os_note],
    ["RTT 对比", rttPending ? "pending" : v.rtt, rttPending ? "正在测量应用层 RTT" : v.rtt_note],
    ["握手到首包间隔", v.first_data_gap, v.gap_note],
  ];
  $("verdicts").innerHTML = items.map(([k, s, n]) => {
    const [cls, word] = status(s);
    return `<div class="v ${cls}"><div class="k">${k}</div><div class="s ${cls}"><span class="dot"></span>${word}</div><div class="n">${esc(n)}</div></div>`;
  }).join("");
}

function famChip(f) {
  const fam = f?.family || "unknown";
  return `<span class="chip fam-${esc(fam)}">${esc(FAM_LABEL[fam] || fam)}</span>`;
}

function renderLayers(r) {
  const s = r.tcp?.syn, p = r.tcp?.p0f, tls = r.tls, h = r.http || {};
  const tcpBlock = `
    <div class="layer">
      <div class="head"><span class="title">TCP/IP 层</span>${famChip(r.os_tcp)}</div>
      <div class="big">${esc(r.os_tcp?.label)}</div>
      <dl class="kv">
        <dt>依据</dt><dd>${esc(r.os_tcp?.source)}</dd>
        <dt>p0f 签名</dt><dd class="mono">${esc(p?.signature ?? "未抓到 SYN")}</dd>
        <dt>跳数</dt><dd class="num">${s ? `${s.hops}（初始 TTL ${s.initial_ttl}）` : "—"}</dd>
        <dt>MTU</dt><dd class="num">${esc(p?.mtu ?? "—")}${p?.link ? ` · ${esc(p.link)}` : ""}</dd>
      </dl>
      <div class="arrow-note">由服务器出口内核发出，SS 无法透传</div>
    </div>`;
  const tlsBlock = `
    <div class="layer">
      <div class="head"><span class="title">TLS 层</span><span class="chip">浏览器原样透传</span></div>
      <div class="big mono" style="font-size:14px">${esc(tls?.ja4 ?? (r.transport === "http" ? "明文 HTTP，无 TLS" : "未解析到 ClientHello"))}</div>
      <dl class="kv">
        <dt>版本</dt><dd>${esc(tls?.version ?? "—")}</dd>
        <dt>ALPN</dt><dd>${esc(tls?.alpn_offered ?? "—")} → ${esc(tls?.alpn_negotiated ?? "—")}</dd>
        <dt>SNI</dt><dd>${esc(tls?.sni ?? "—")}</dd>
        <dt>规模</dt><dd class="num">${tls ? `${tls.cipher_count} 套件 · ${tls.extension_count} 扩展 · ${tls.client_hello_len} 字节` : "—"}</dd>
      </dl>
      <div class="arrow-note">JA4 反映浏览器，不直接给出 OS</div>
    </div>`;
  const httpBlock = `
    <div class="layer">
      <div class="head"><span class="title">HTTP 层</span>${famChip(r.os_http)}</div>
      <div class="big">${esc(r.os_http?.label)}</div>
      <dl class="kv">
        <dt>依据</dt><dd>${esc(r.os_http?.source)}</dd>
        <dt>UA</dt><dd class="mono">${esc(h.user_agent ?? "—")}</dd>
        <dt>语言</dt><dd>${esc(h.accept_language ?? "—")}</dd>
        <dt>时区</dt><dd>${esc(r.client?.timezone ?? "—")}</dd>
      </dl>
      <div class="arrow-note">浏览器自报，检测方拿它和 TCP 层比对</div>
    </div>`;
  $("layers").innerHTML = tcpBlock + tlsBlock + httpBlock;
}

function renderSyn(r) {
  const s = r.tcp?.syn;
  const fam = r.os_http?.family;
  const tpl = TEMPLATES[fam];
  $("tpl-chip").textContent = tpl ? `对照：${tpl.name} 参考模板` : "浏览器 OS 未知，不做对照";
  if (!s) {
    $("syn").innerHTML = `<tr><td>没有抓到这条连接的 SYN。经过 CDN 或本机回环访问时会这样。</td></tr>`;
    $("syn-foot").textContent = "";
    return;
  }
  const names = (s.options || []).map((o) => o.split("=")[0]);
  const optChips = (list, other) => `<div class="opts">${list.map((o, i) => `<span class="opt${other && other[i] !== o.split("=")[0] ? " miss" : ""}">${esc(o)}</span>`).join("")}</div>`;
  const rows = [
    ["初始 TTL", `${s.initial_ttl}（观测 ${s.ttl}）`, tpl?.ttl, tpl && s.initial_ttl !== tpl.ttl],
    ["SYN 窗口", s.window, tpl?.window, tpl && s.window !== tpl.window],
    ["窗口缩放 wscale", s.wscale ?? "无", tpl?.wscale, tpl && s.wscale !== tpl.wscale],
    ["时间戳 TS", s.timestamps ? "有" : "无", tpl ? (tpl.ts ? "有" : "无") : null, tpl && s.timestamps !== tpl.ts],
    ["选项顺序", optChips(s.options || [], tpl?.opts), tpl ? optChips(tpl.opts, names) : null, tpl && names.join() !== tpl.opts.join(), true],
    ["MSS", s.mss ?? "无", "按出口路径", false],
    ["DF", s.df ? "置位" : "未置位", tpl ? (tpl.df ? "置位" : "未置位") : null, tpl && s.df !== tpl.df],
    ["ECN（ECE/CWR）", s.ece || s.cwr ? `ECE ${s.ece ? 1 : 0} · CWR ${s.cwr ? 1 : 0}` : "未协商", "待校准", false],
    ["IP ID", s.ip_id, "—", false],
    ["握手后 ACK 窗口", r.tcp?.ack?.window ?? "—", "—", false],
  ];
  $("syn").innerHTML = `<thead><tr><th></th><th>字段</th><th>本次观测</th><th>${tpl ? esc(tpl.name) + " 参考值" : "参考值"}</th></tr></thead><tbody>` +
    rows.map(([k, obs, exp, diff, raw]) => `<tr class="${diff ? "diff" : ""}"><td class="mark">${diff ? '<span class="diff-mark" title="不同">✕</span>' : tpl && exp != null && exp !== "—" && exp !== "待校准" && exp !== "按出口路径" ? '<span class="ok-mark" title="相同">✓</span>' : ""}</td><td>${k}</td><td class="obs num">${raw ? obs : esc(obs)}</td><td class="num">${exp == null ? "—" : raw ? exp : esc(exp)}</td></tr>`).join("") + "</tbody>";
  const n = rows.filter((x) => x[3]).length;
  $("syn-foot").textContent = tpl ? `${n} 项与 ${tpl.name} 参考模板不同。参考值来自设计文档，尚未用真实设备校准。` : "";
}

// 握手时序：按真实时间比例画 SYN → SYN-ACK → ACK → 首包
function renderHandshake(r) {
  const t = r.tcp;
  if (!t?.syn_at && t?.syn_at !== 0 || !t?.ack_at) { $("hs").innerHTML = '<div class="foot">没有完整的握手时间戳。</div>'; return; }
  const ms = (x) => (x == null ? null : (x - t.syn_at) / 1e6);
  const ev = [
    ["SYN", ms(t.syn_at), "客户端"],
    ["SYN-ACK", ms(t.synack_at), "靶机"],
    ["ACK", ms(t.ack_at), "客户端"],
    ["首包", ms(t.first_data_at), "客户端"],
  ].filter((e) => e[1] != null);
  const W = 460, L = 16, R = 444, max = Math.max(...ev.map((e) => e[1])) || 1;
  const X = (v) => L + (v / max) * (R - L);
  const lanes = { "客户端": 44, "靶机": 96 };
  let s = `<svg viewBox="0 0 ${W} 150" width="100%" role="img" aria-label="握手时序">`;
  s += `<line x1="${L}" x2="${R}" y1="70" y2="70" stroke="var(--line)" stroke-width="1"/>`;
  ev.forEach(([name, v, who], i) => {
    const x = X(v), y = lanes[who];
    const anchor = x > R - 40 ? "end" : x < L + 30 ? "start" : "middle";
    s += `<line x1="${x}" x2="${x}" y1="70" y2="${y}" stroke="var(--muted)" stroke-width="1"/>`;
    s += `<circle cx="${x}" cy="70" r="4" fill="${name === "首包" ? "var(--accent)" : "var(--fg)"}"/>`;
    const ty = who === "客户端" ? y - 6 : y + 14;
    s += `<text x="${x}" y="${ty}" text-anchor="${anchor}" font-size="12" fill="var(--fg)" font-weight="600">${name}</text>`;
    s += `<text x="${x}" y="${who === "客户端" ? ty - 14 : ty + 14}" text-anchor="${anchor}" font-size="11" fill="var(--muted)">${fmt(v, 1)}</text>`;
  });
  const a = ms(t.ack_at), f = ms(t.first_data_at);
  if (a != null && f != null) {
    s += `<line x1="${X(a)}" x2="${X(f)}" y1="128" y2="128" stroke="var(--accent)" stroke-width="2"/>`;
    s += `<text x="${(X(a) + X(f)) / 2}" y="144" text-anchor="middle" font-size="11" fill="var(--accent)">ACK → 首包 ${fmt(f - a, 1)}</text>`;
  }
  s += `</svg>`;
  $("hs").innerHTML = s;
}

// RTT：TCP 握手 RTT 与应用层 RTT（每个采样一个点，横条取最小值）
function renderRtt(r, pending) {
  const tm = r.timing || {};
  const samples = r.client?.rtt_samples_ms || [];
  const rows = [
    ["TCP 握手", tm.handshake_rtt_ms ?? tm.kernel_rtt_ms, []],
    ["应用层", tm.app_rtt_ms, samples],
  ];
  const max = Math.max(1, ...rows.map((x) => x[1] || 0), ...samples) * 1.12;
  const W = 380, L = 64, R = 360, X = (v) => L + (v / max) * (R - L);
  const step = max > 400 ? 100 : max > 150 ? 50 : max > 60 ? 20 : 10;
  let s = `<svg viewBox="0 0 ${W} 128" width="100%" role="img" aria-label="RTT 对比">`;
  for (let v = 0; v <= max; v += step) {
    s += `<line x1="${X(v)}" x2="${X(v)}" y1="14" y2="96" stroke="var(--line)" stroke-width="1"/>`;
    s += `<text x="${X(v)}" y="112" text-anchor="middle" font-size="10.5" fill="var(--muted)">${v}</text>`;
  }
  rows.forEach(([name, v, pts], i) => {
    const y = 30 + i * 44;
    s += `<text x="${L - 8}" y="${y + 4}" text-anchor="end" font-size="12" fill="var(--fg)">${name}</text>`;
    if (v != null) {
      s += `<rect x="${L}" y="${y - 8}" width="${Math.max(1, X(v) - L)}" height="16" rx="3" fill="${i ? "var(--accent)" : "var(--muted)"}" fill-opacity="${i ? 0.28 : 0.35}"/>`;
      pts.forEach((p) => { s += `<circle cx="${X(p)}" cy="${y}" r="2.6" fill="var(--accent)" fill-opacity="0.75"/>`; });
      s += `<text x="${Math.min(X(v) + 6, R - 2)}" y="${y + 4}" font-size="12" font-weight="600" fill="var(--fg)" text-anchor="${X(v) + 40 > R ? "end" : "start"}">${fmt(v, 1)}</text>`;
    } else {
      s += `<text x="${L}" y="${y + 4}" font-size="12" fill="var(--muted)">${pending ? "测量中…" : "无数据"}</text>`;
    }
  });
  s += `</svg>`;
  $("rtt").innerHTML = s;
  $("rtt-foot").textContent = samples.length
    ? `应用层取 ${samples.length} 次 /ping 的最小值。TCP 握手 RTT 是靶机到连接发起方（SS 出口）的距离，应用层 RTT 是到真实浏览器的距离。`
    : "TCP 握手 RTT 是靶机到连接发起方的距离。";
}

function renderHistory(list) {
  if (!list?.length) { $("hist").innerHTML = `<tr><td class="foot">还没有记录。</td></tr>`; return; }
  const cell = (key) => { const [cls, w] = status(key); return `<span class="${cls}"><span class="dot" style="display:inline-block;margin-right:6px"></span>${w}</span>`; };
  $("hist").innerHTML = `<thead><tr><th>时间</th><th>TCP 层</th><th>浏览器自报</th><th>OS 一致性</th><th>RTT</th><th>握手 / 应用层 RTT</th></tr></thead><tbody>` +
    list.map((h) => `<tr><td class="num">${esc(new Date(h.at).toLocaleTimeString())}</td><td>${esc(h.os_tcp?.label)}</td><td>${esc(h.os_http?.label)}</td><td>${cell(h.verdict?.os_consistency)}</td><td>${cell(h.verdict?.rtt)}</td><td class="num">${fmt(h.timing?.handshake_rtt_ms ?? h.timing?.kernel_rtt_ms)} / ${fmt(h.timing?.app_rtt_ms)}</td></tr>`).join("") + "</tbody>";
}

let current = null;
function renderAll(r, opts) {
  current = r;
  renderMeta(r, opts.live);
  renderVerdicts(r, opts.pending);
  renderLayers(r);
  renderSyn(r);
  renderHandshake(r);
  renderRtt(r, opts.pending);
  $("raw").textContent = JSON.stringify(r, null, 2);
}

$("copy").addEventListener("click", async () => {
  const text = JSON.stringify(current, null, 2);
  try { await navigator.clipboard.writeText(text); $("copy").textContent = "已复制"; }
  catch { const d = document.querySelector("details"); d.open = true; const range = document.createRange(); range.selectNodeContents($("raw")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range); $("copy").textContent = "已选中，请手动复制"; }
  setTimeout(() => { $("copy").textContent = "复制 JSON"; }, 2000);
});

async function live() {
  const me = await (await fetch("/api/me", { cache: "no-store" })).json();
  renderAll(me, { live: true, pending: true });
  const samples = [];
  for (let i = 0; i < 10; i++) {
    const t = performance.now();
    await fetch("/ping?" + i, { cache: "no-store" });
    samples.push(+(performance.now() - t).toFixed(2));
  }
  const body = { rtt_samples_ms: samples, timezone: Intl.DateTimeFormat().resolvedOptions().timeZone, languages: [...(navigator.languages || [])] };
  const res = await fetch("/api/report?id=" + encodeURIComponent(me.id), { method: "POST", body: JSON.stringify(body) });
  const full = res.ok ? await res.json() : { ...me, client: body };
  renderAll(full, { live: true, pending: false });
  try { renderHistory(await (await fetch("/api/recent", { cache: "no-store" })).json()); } catch { renderHistory([full]); }
}

live().catch(() => {
  renderAll(SAMPLE, { live: false, pending: false });
  renderHistory(SAMPLE_HISTORY);
});
})();
</script>
